# Nightly copy of the whole database, kept for 90 days as an encrypted file on this workflow's runs.
# The repository is public, so the file is encrypted with BACKUP_PASSWORD before upload. See docs/backups.md.
name: Database backup

on:
  schedule:
    - cron: "30 20 * * *" # 02:00 India time
  workflow_dispatch:

concurrency: backup

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          [ -n "$DATABASE_URL" ] || { echo "::error::Add the DATABASE_URL secret (docs/backups.md)"; exit 1; }
          [ ${#BACKUP_PASSWORD} -ge 16 ] || { echo "::error::Add a BACKUP_PASSWORD secret of at least 16 characters (docs/backups.md)"; exit 1; }

      - name: Install pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      - name: Dump the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Same as lib/db.ts: pg_dump needs the session pooler (5432), not the transaction pooler (6543).
          url=$(node -e 'const u = new URL(process.env.DATABASE_URL); if (u.hostname.endsWith(".pooler.supabase.com") && u.port === "6543") u.port = "5432"; console.log(u.toString())')
          echo "::add-mask::$url"
          name="acads-$(TZ=Asia/Kolkata date +%Y-%m-%d-%H%M)"
          echo "NAME=$name" >> "$GITHUB_ENV"
          # All app tables live in the public schema; Supabase's own schemas are left out.
          pg_dump "$url" --schema=public --format=custom --no-owner --no-privileges --file="$name.dump"
          tables=$(pg_restore --list "$name.dump" | grep -c " TABLE DATA public ")
          echo "Dumped $tables tables, $(du -h "$name.dump" | cut -f1)"
          [ "$tables" -ge 5 ] || { echo "::error::Only $tables tables in the dump"; exit 1; }

      - name: Encrypt
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 \
            --output "$NAME.dump.gpg" "$NAME.dump" 3<<< "$BACKUP_PASSWORD"
          rm "$NAME.dump"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.dump.gpg
          retention-days: 90
          if-no-files-found: error
